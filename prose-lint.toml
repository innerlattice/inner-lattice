# Configuration for tools/prose-lint. Run with `npm run lint:prose`.
include = ["src/content/posts/universal-*.md"]

[lexicon]
agent = ["AI agent", "agent", "model", "person", "player", "user", "staff", "operator", "developer", "author", "team", "customer", "bank", "merchant", "issuer", "reader"]
physical = ["server", "device", "phone", "host", "machine", "client", "computer", "disk", "network", "data center"]
abstract = [
  "sequencer", "evaluator", "dispatcher", "scope", "seal", "choice", "record", "function", "theorem", "runtime",
  "compiler", "language", "program", "system", "protocol", "query", "value", "state", "step", "release",
  "version", "relation", "table", "transaction", "output", "input", "test", "label", "declaration", "type",
]
text = ["rule", "message", "request", "prompt"]
mixed = ["resolver", "participant", "party", "place", "replica", "node", "process", "service"]

[rules.literal-verbs]
severity = "warning"
allow = ["field contribute"]  # a field of study contributes through its researchers

[rules.ambiguous-pronouns]
severity = "warning"
ratio = 0.95
