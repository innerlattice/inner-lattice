<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" role="img" aria-labelledby="title desc">
  <title id="title">A live schema migration recorded as a log entry</title>
  <desc id="desc">Time runs left to right. A migration from version 1 to version 2 is appended to the log at an epoch. Before the epoch, version 1 clients write directly to the log. After it, their writes pass through a lens that translates version 1 operations into version 2 operations, while version 2 clients write directly. A flow that was running at the epoch keeps its version 1 step until its next commit point, where its program counter moves to the version 2 step with the same stable question id.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="arrowhead" d="M1 1 L9 5 L1 9 Z"/>
    </marker>
  </defs>

  <text class="axis" x="20" y="64">v1 clients</text>
  <text class="axis" x="20" y="164">Log</text>
  <text class="axis" x="20" y="224">v2 clients</text>
  <text class="axis" x="20" y="284">Running flow</text>

  <line class="line dashed" x1="360" y1="40" x2="360" y2="300"/>
  <text class="note" x="368" y="30">Epoch: the migration is a log entry</text>

  <g class="slate">
    <line class="line" x1="140" y1="60" x2="560" y2="60"/>
    <circle class="dot" cx="190" cy="60" r="5"/>
    <circle class="dot" cx="290" cy="60" r="5"/>
    <circle class="dot" cx="430" cy="60" r="5"/>
    <line class="line" x1="190" y1="66" x2="190" y2="152" marker-end="url(#arrow)"/>
    <line class="line" x1="290" y1="66" x2="290" y2="152" marker-end="url(#arrow)"/>
    <line class="line" x1="430" y1="66" x2="430" y2="86" marker-end="url(#arrow)"/>
    <line class="line" x1="430" y1="128" x2="430" y2="152" marker-end="url(#arrow)"/>
  </g>

  <g class="gold">
    <rect class="box" x="410" y="88" width="140" height="40" rx="6"/>
    <text class="head" x="446" y="105">Lens</text>
    <text class="note" x="446" y="121">v1 op → v2 op</text>
  </g>

  <g class="slate">
    <line class="line" x1="140" y1="160" x2="660" y2="160" stroke-width="2"/>
    <circle class="dot" cx="190" cy="160" r="4"/>
    <circle class="dot" cx="290" cy="160" r="4"/>
    <circle class="dot" cx="430" cy="160" r="4"/>
    <circle class="dot" cx="520" cy="160" r="4"/>
    <circle class="dot" cx="600" cy="160" r="4"/>
  </g>
  <g class="love">
    <path class="box" d="M360 149 L371 160 L360 171 L349 160 Z"/>
  </g>

  <g class="pine">
    <line class="line-hue" x1="360" y1="220" x2="660" y2="220"/>
    <circle class="dot" cx="520" cy="220" r="5"/>
    <circle class="dot" cx="600" cy="220" r="5"/>
    <line class="line" x1="520" y1="214" x2="520" y2="168" marker-end="url(#arrow)"/>
    <line class="line" x1="600" y1="214" x2="600" y2="168" marker-end="url(#arrow)"/>
  </g>

  <g class="slate">
    <rect class="box" x="170" y="266" width="330" height="28" rx="4"/>
    <text class="label" x="182" y="285">Waiting at question sleep_hours, v1</text>
  </g>
  <g class="pine">
    <rect class="box" x="500" y="266" width="160" height="28" rx="4"/>
    <text class="label" x="512" y="285">Same question, v2</text>
  </g>
  <circle class="dot" cx="500" cy="280" r="5"/>
  <text class="note" x="170" y="318">At its next commit point, the flow moves to v2 by stable question id.</text>
</svg>
