    <text transform="translate(538 132) rotate(-60)">View</text>
    <text transform="translate(614 132) rotate(-60)">Scope</text>
    <text transform="translate(688 132) rotate(-60)">Sequencer</text>
    <text transform="translate(764 132) rotate(-60)">Seal</text>
    <text transform="translate(838 132) rotate(-60)">Provisional value</text>
    <text transform="translate(914 132) rotate(-60)">Goal</text>
    <text transform="translate(988 132) rotate(-60)">Version</text>
    <text x="122" y="168" text-anchor="end">Choice</text>
