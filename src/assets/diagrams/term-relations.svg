<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 702" class="wide" role="img" aria-labelledby="title desc">
  <title id="title">How the terms of the theory relate</title>
  <desc id="desc">A matrix with twelve terms of the theory as rows (from) and columns (to): Choice, Resolver, Record, Function, Binding, View, Scope, Sequencer, Seal, Provisional value, Goal, and Version. Each filled cell holds a verb that reads from the row term to the column term. Cells on the diagonal relate two instances of one term. Dashed lines separate the four primitives from the other terms. A choice couples with other choices, constrains the records made at it, and specifies its view. A resolver resolves choices, can replace another resolver, supplies records, and can optimize a goal. A record answers one choice, names its resolver, supersedes an earlier record, includes the view that was shown, and carries the program version. A function opens and couples choices, can serve as a resolver, reads records, composes with other functions, computes views, picks out scopes, and outputs provisional values. A binding routes a choice to the resolver it names. A view informs a resolver. A scope contains records and can split into smaller scopes. A sequencer admits records, orders its scope, and writes seals. A seal closes a scope up to a position, extends earlier seals, and finalizes provisional values. A provisional value appears in a view. A goal steers resolvers, scores records, bounds guardrail functions, and evaluates bindings. A version declares choices, translates old records, defines functions, includes bindings, and supersedes the previous version.</desc>

  <text class="axis" x="582" y="16" text-anchor="middle">To</text>
  <text class="axis" transform="translate(18 418) rotate(-90)" text-anchor="middle">From</text>
  <line class="grid dashed" x1="430" y1="136" x2="430" y2="694"/>
  <line class="grid dashed" x1="126" y1="324" x2="1032" y2="324"/>
