    <text class="ink" x="137" y="321" text-anchor="middle" style="font-style: italic; font-size: 12px">maps</text>
    <rect class="box" x="178" y="296" width="74" height="42" rx="4"/>
    <text class="ink" x="215" y="321" text-anchor="middle" style="font-style: italic; font-size: 12px">names</text>
    <rect class="box" x="256" y="342" width="74" height="42" rx="4"/>
    <text class="ink" x="293" y="367" text-anchor="middle" style="font-style: italic; font-size: 12px">contains</text>
