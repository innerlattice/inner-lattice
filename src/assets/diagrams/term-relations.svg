    <rect class="box" x="100" y="526" width="74" height="42" rx="4"/>
    <text class="ink" x="137" y="551" text-anchor="middle" style="font-style: italic; font-size: 12px">defines</text>
    <rect class="box" x="256" y="526" width="74" height="42" rx="4"/>
    <text class="ink" x="293" y="544" text-anchor="middle" style="font-style: italic; font-size: 12px">marks /</text>
    <text class="ink" x="293" y="559" text-anchor="middle" style="font-style: italic; font-size: 12px">translates</text>
    <rect class="box" x="334" y="526" width="74" height="42" rx="4"/>
