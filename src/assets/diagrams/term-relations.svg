    <text class="ink" x="293" y="505" text-anchor="middle" style="font-style: italic; font-size: 12px">scores</text>
    <rect class="box" x="334" y="480" width="74" height="42" rx="4"/>
    <text class="ink" x="371" y="505" text-anchor="middle" style="font-style: italic; font-size: 12px">bounds</text>
