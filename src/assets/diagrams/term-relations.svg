    <text class="ink" x="137" y="130" text-anchor="middle" style="font-style: italic; font-size: 12px">couples</text>
    <text class="ink" x="137" y="145" text-anchor="middle" style="font-style: italic; font-size: 12px">with</text>
    <rect class="box" x="178" y="158" width="74" height="42" rx="4"/>
