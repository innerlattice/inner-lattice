    <text class="ink" x="527" y="375" text-anchor="middle" style="font-style: italic; font-size: 12px">into</text>
    <rect class="box" x="646" y="434" width="74" height="42" rx="4"/>
    <text class="ink" x="683" y="459" text-anchor="middle" style="font-style: italic; font-size: 12px">extends</text>
    <rect class="box" x="802" y="526" width="74" height="42" rx="4"/>
    <text class="ink" x="839" y="551" text-anchor="middle" style="font-style: italic; font-size: 12px">supersedes</text>
