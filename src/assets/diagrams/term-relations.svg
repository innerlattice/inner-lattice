<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 580" class="wide" role="img" aria-labelledby="title desc">
  <title id="title">How the terms of the theory relate</title>
  <desc id="desc">A matrix with ten terms of the theory as rows (from) and columns (to): Choice, Resolver, Record, Function, Binding, Scope, Sequencer, Seal, Goal, and Version. Each filled cell holds a verb that reads from the row term to the column term. Cells on the diagonal relate two instances of one term. Dashed lines separate the four primitives from the other terms. A choice couples with other choices, constrains the records made at it, and specifies its view and option functions. A resolver resolves choices and can substitute for another resolver. A record answers one choice, names its resolver, supersedes an earlier record, and carries the program version. A function opens and couples choices, can serve as a resolver, reads records, composes with other functions, and picks out scopes. A binding maps a choice to the resolver it names. A scope contains records and can split into smaller scopes. A sequencer admits records, orders its scope, and writes seals. A seal closes a scope up to a position and extends earlier seals. A goal steers resolvers, scores sets of records, bounds guardrail functions, and evaluates bindings. A version defines choices and functions, translates old records, includes bindings, and supersedes the previous version.</desc>

  <text class="axis" x="490" y="16" text-anchor="middle">To</text>
  <text class="axis" transform="translate(18 342) rotate(-90)" text-anchor="middle">From</text>
  <line class="grid dashed" x1="410" y1="106" x2="410" y2="572"/>
  <line class="grid dashed" x1="94" y1="294" x2="880" y2="294"/>
  <g class="label strong">
    <text transform="translate(133 102) rotate(-60)">Choice</text>
    <text transform="translate(211 102) rotate(-60)">Resolver</text>
    <text transform="translate(289 102) rotate(-60)">Record</text>
    <text transform="translate(367 102) rotate(-60)">Function</text>
    <text transform="translate(445 102) rotate(-60)">Binding</text>
    <text transform="translate(523 102) rotate(-60)">Scope</text>
    <text transform="translate(601 102) rotate(-60)">Sequencer</text>
    <text transform="translate(679 102) rotate(-60)">Seal</text>
    <text transform="translate(757 102) rotate(-60)">Goal</text>
    <text transform="translate(835 102) rotate(-60)">Version</text>
    <text x="90" y="138" text-anchor="end">Choice</text>
    <text x="90" y="184" text-anchor="end">Resolver</text>
    <text x="90" y="230" text-anchor="end">Record</text>
    <text x="90" y="276" text-anchor="end">Function</text>
    <text x="90" y="322" text-anchor="end">Binding</text>
    <text x="90" y="368" text-anchor="end">Scope</text>
    <text x="90" y="414" text-anchor="end">Sequencer</text>
    <text x="90" y="460" text-anchor="end">Seal</text>
    <text x="90" y="506" text-anchor="end">Goal</text>
    <text x="90" y="552" text-anchor="end">Version</text>
  </g>
