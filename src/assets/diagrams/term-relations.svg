    <rect class="box" x="256" y="526" width="74" height="42" rx="4"/>
    <text class="ink" x="293" y="551" text-anchor="middle" style="font-style: italic; font-size: 12px">translates</text>
    <rect class="box" x="334" y="526" width="74" height="42" rx="4"/>
    <text class="ink" x="371" y="551" text-anchor="middle" style="font-style: italic; font-size: 12px">defines</text>
    <rect class="box" x="412" y="526" width="74" height="42" rx="4"/>
    <text class="ink" x="449" y="551" text-anchor="middle" style="font-style: italic; font-size: 12px">includes</text>
  </g>
  <g class="foam">
