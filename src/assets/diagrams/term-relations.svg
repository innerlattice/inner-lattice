    <text class="ink" x="293" y="229" text-anchor="middle" style="font-style: italic; font-size: 12px">supersedes</text>
    <rect class="box" x="334" y="250" width="74" height="42" rx="4"/>
    <text class="ink" x="371" y="268" text-anchor="middle" style="font-style: italic; font-size: 12px">composes</text>
