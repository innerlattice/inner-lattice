    <rect class="box" x="334" y="112" width="74" height="42" rx="4"/>
    <text class="ink" x="371" y="137" text-anchor="middle" style="font-style: italic; font-size: 12px">specifies</text>
    <rect class="box" x="100" y="158" width="74" height="42" rx="4"/>
