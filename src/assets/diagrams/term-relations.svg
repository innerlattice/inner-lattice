<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 580" class="wide" role="img" aria-labelledby="title desc">
  <title id="title">How the terms of the theory relate</title>
  <desc id="desc">A matrix with ten terms of the theory as rows (from) and columns (to): Choice, Resolver, Record, Function, Binding, Scope, Sequencer, Seal, Goal, and Version. Each filled cell holds a verb that reads from the row term to the column term. Cells on the diagonal relate two instances of one term. Dashed lines separate the four primitives and the terms added by each principle. The terms are ordered so that every relation points from a later term to an earlier one, and the row for choice is empty. A resolver resolves choices. A record answers one choice, names its resolver, and can supersede an earlier record. A function opens and couples choices, can serve as a resolver, reads records, and composes with other functions. A binding maps a choice to the resolver it names. A scope contains records and can split into smaller scopes. A sequencer admits records and orders its scope. A seal closes a scope up to a position, names its sequencer, and extends earlier seals. A goal steers resolvers, scores sets of records, bounds guardrail functions, and evaluates bindings. A version defines choices and functions, marks and translates records, includes bindings, and supersedes the previous version.</desc>

  <text class="axis" x="490" y="16" text-anchor="middle">To</text>
  <text class="axis" transform="translate(18 342) rotate(-90)" text-anchor="middle">From</text>
  <line class="grid dashed" x1="410" y1="106" x2="410" y2="572"/>
  <line class="grid dashed" x1="94" y1="294" x2="880" y2="294"/>
  <line class="grid dashed" x1="488" y1="106" x2="488" y2="572"/>
  <line class="grid dashed" x1="94" y1="340" x2="880" y2="340"/>
  <line class="grid dashed" x1="722" y1="106" x2="722" y2="572"/>
  <line class="grid dashed" x1="94" y1="478" x2="880" y2="478"/>
  <line class="grid dashed" x1="800" y1="106" x2="800" y2="572"/>
  <line class="grid dashed" x1="94" y1="524" x2="880" y2="524"/>
