    <rect class="box" x="100" y="204" width="74" height="42" rx="4"/>
    <text class="ink" x="137" y="229" text-anchor="middle" style="font-style: italic; font-size: 12px">answers</text>
    <rect class="box" x="178" y="204" width="74" height="42" rx="4"/>
    <text class="ink" x="215" y="229" text-anchor="middle" style="font-style: italic; font-size: 12px">names</text>
    <rect class="box" x="100" y="250" width="74" height="42" rx="4"/>
    <text class="ink" x="137" y="268" text-anchor="middle" style="font-style: italic; font-size: 12px">opens /</text>
    <text class="ink" x="137" y="283" text-anchor="middle" style="font-style: italic; font-size: 12px">couples</text>
    <rect class="box" x="178" y="250" width="74" height="42" rx="4"/>
