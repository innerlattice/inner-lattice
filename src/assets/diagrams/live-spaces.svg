<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-labelledby="title desc">
  <title id="title">Co-present live spaces by coupling, latency and density</title>
  <desc id="desc">Products where participants see each other's changes as they happen, placed by whether concurrent writes merge or contest, and by how fast feedback must arrive. Ring size shows how many participants share one area of interest. Canvases on the left merge writes without a sequencer. Arenas on the right need a sequencer. A dashed line marks the global round-trip floor; above it, servers must sit near their participants.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrowhead" d="M1 1 L9 5 L1 9 Z"/>
    </marker>
  </defs>

  <g class="rose">
    <rect class="box" x="80" y="24" width="280" height="360" rx="6"/>
    <text class="head" x="92" y="46">Canvases</text>
    <text class="note" x="92" y="64">Writes merge without a sequencer</text>
    <circle class="ring" cx="250" cy="92" r="6"/><text class="label" x="262" y="96">Music jam</text>
    <circle class="ring" cx="210" cy="226" r="10"/><text class="label" x="226" y="230">Figma</text>
    <circle class="ring" cx="138" cy="262" r="16"/><text class="label" x="160" y="266">Miro</text>
    <circle class="ring" cx="236" cy="304" r="10"/><text class="label" x="252" y="308">Google Docs</text>
    <circle class="ring" cx="146" cy="352" r="6"/><text class="label" x="158" y="356">Notion</text>
  </g>

  <g class="love">
    <rect class="box" x="360" y="24" width="280" height="360" rx="6"/>
    <text class="head" x="372" y="46">Arenas</text>
    <text class="note" x="372" y="64">A sequencer orders conflicting writes</text>
    <circle class="ring" cx="604" cy="86" r="6"/><text class="label" x="592" y="90" text-anchor="end">Fighting game</text>
    <circle class="ring" cx="550" cy="120" r="6"/><text class="label" x="538" y="124" text-anchor="end">Tactical shooter</text>
    <circle class="ring" cx="480" cy="160" r="16"/><text class="label" x="502" y="164">Battle royale</text>
    <circle class="ring" cx="604" cy="214" r="16"/><text class="label" x="582" y="218" text-anchor="end">Live quiz show</text>
    <circle class="ring" cx="412" cy="238" r="6"/><text class="label" x="424" y="242">RTS lockstep</text>
    <circle class="ring" cx="480" cy="280" r="16"/><text class="label" x="502" y="284">MMO zone</text>
    <circle class="ring" cx="590" cy="330" r="22"/><text class="label" x="562" y="334" text-anchor="end">EVE fleet battle</text>
    <circle class="ring" cx="420" cy="352" r="16"/><text class="label" x="442" y="356">Live auction</text>
  </g>

  <line class="line dashed" x1="80" y1="190" x2="640" y2="190"/>
  <text class="note" x="92" y="184">Global round-trip floor</text>
  <text class="note" x="372" y="184">Above it, servers sit near players</text>

  <text class="axis" x="80" y="412">Mergeable</text>
  <text class="axis" x="640" y="412" text-anchor="end">Contested</text>
  <line class="line" x1="152" y1="408" x2="560" y2="408" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="axis" x="62" y="384" transform="rotate(-90 62 384)">Seconds</text>
  <text class="axis" x="62" y="24" transform="rotate(-90 62 24)" text-anchor="end">Milliseconds</text>
  <line class="line" x1="58" y1="324" x2="58" y2="112" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text class="note" x="80" y="456">Participants in one area of interest</text>
  <g class="slate">
    <circle class="line" cx="312" cy="452" r="6"/><text class="note" x="324" y="456">2–10</text>
    <circle class="line" cx="382" cy="452" r="10"/><text class="note" x="398" y="456">10–100</text>
    <circle class="line" cx="472" cy="452" r="16"/><text class="note" x="494" y="456">100+</text>
    <circle class="line" cx="560" cy="452" r="22"/><text class="note" x="588" y="456">1,000+</text>
  </g>
</svg>
