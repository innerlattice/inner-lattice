<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 680 340" role="img" aria-labelledby="title desc">
  <title id="title">One coupling graph, four uses</title>
  <desc id="desc">Choices joined by two kinds of edge computed from the functions. A read-coupling edge means a record from one choice can change the other choice's view or options. An order-coupling edge means records from the two choices can each be admitted alone but not together. The graph is partitioned into three parts joined by three edges that cross parts. Sync and presence deliver records along read-coupling edges. Sharding gives each part of the order-coupling graph one sequencer. Experiments give each part of the read-coupling graph one variant, and edges between parts carry treatment between variants. Access rules can remove read-coupling edges but not order-coupling edges.</desc>

  <g class="slate">
    <ellipse class="box" cx="120" cy="118" rx="82" ry="62"/>
    <ellipse class="box" cx="312" cy="108" rx="72" ry="56"/>
    <ellipse class="box" cx="205" cy="278" rx="102" ry="56"/>
  </g>

  <g class="line">
    <line x1="90" y1="90" x2="120" y2="140"/><line x1="70" y1="150" x2="120" y2="140"/><line x1="165" y1="150" x2="120" y2="140"/><line x1="150" y1="85" x2="165" y2="150"/>
    <line x1="272" y1="80" x2="302" y2="138"/><line x1="332" y1="78" x2="302" y2="138"/><line x1="332" y1="78" x2="352" y2="132"/>
    <line x1="170" y1="252" x2="205" y2="302"/><line x1="240" y1="247" x2="205" y2="302"/><line x1="240" y1="247" x2="262" y2="302"/><line x1="148" y1="306" x2="205" y2="302"/><line x1="148" y1="306" x2="170" y2="252"/>
  </g>
  <g class="gold">
    <line class="line-hue" x1="90" y1="90" x2="150" y2="85" style="stroke-width: 3"/>
    <line class="line-hue" x1="150" y1="85" x2="120" y2="140" style="stroke-width: 3"/>
    <line class="line-hue" x1="272" y1="80" x2="332" y2="78" style="stroke-width: 3"/>
    <line class="line-hue" x1="302" y1="138" x2="352" y2="132" style="stroke-width: 3"/>
    <line class="line-hue" x1="170" y1="252" x2="240" y2="247" style="stroke-width: 3"/>
    <line class="line-hue" x1="205" y1="302" x2="262" y2="302" style="stroke-width: 3"/>
  </g>
  <g>
    <line class="cut" x1="165" y1="150" x2="272" y2="80"/>
    <line class="cut" x1="120" y1="140" x2="170" y2="252"/>
    <line class="cut" x1="302" y1="138" x2="240" y2="247"/>
  </g>
  <g class="slate">
    <circle class="dot" cx="90" cy="90" r="5"/><circle class="dot" cx="150" cy="85" r="5"/><circle class="dot" cx="120" cy="140" r="5"/><circle class="dot" cx="70" cy="150" r="5"/><circle class="dot" cx="165" cy="150" r="5"/>
    <circle class="dot" cx="272" cy="80" r="5"/><circle class="dot" cx="332" cy="78" r="5"/><circle class="dot" cx="302" cy="138" r="5"/><circle class="dot" cx="352" cy="132" r="5"/>
    <circle class="dot" cx="170" cy="252" r="5"/><circle class="dot" cx="240" cy="247" r="5"/><circle class="dot" cx="205" cy="302" r="5"/><circle class="dot" cx="262" cy="302" r="5"/><circle class="dot" cx="148" cy="306" r="5"/>
  </g>

  <line class="line" x1="40" y1="358" x2="68" y2="358"/>
  <text class="note" x="76" y="362">read coupling</text>
  <g class="gold"><line class="line-hue" x1="176" y1="358" x2="204" y2="358" style="stroke-width: 3"/></g>
  <text class="note" x="212" y="362">order coupling</text>
  <line class="cut" x1="316" y1="358" x2="344" y2="358"/>
  <text class="note" x="352" y="362">crosses parts</text>

  <g class="slate">
    <rect class="card" x="430" y="48" width="230" height="64" rx="6"/>
    <text class="head" x="446" y="74">Sync and presence</text>
    <text class="note" x="446" y="94">Deliver records along edges</text>
    <rect class="card" x="430" y="124" width="230" height="64" rx="6"/>
    <text class="head" x="446" y="150">Sharding</text>
    <text class="note" x="446" y="170">One sequencer per part</text>
    <rect class="card" x="430" y="200" width="230" height="64" rx="6"/>
    <text class="head" x="446" y="226">Experiment units</text>
    <text class="note" x="446" y="246">One variant per part</text>
    <rect class="card" x="430" y="276" width="230" height="82" rx="6"/>
    <text class="head" x="446" y="302">Access rules</text>
    <text class="note" x="446" y="322">Remove read edges;</text>
    <text class="note" x="446" y="340">order edges remain</text>
  </g>
</svg>
