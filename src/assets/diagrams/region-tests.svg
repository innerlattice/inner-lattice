<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" role="img" aria-labelledby="title desc">
  <title id="title">Four questions that place a commit point in a region</title>
  <desc id="desc">A sequence of questions asked of one commit point. If the program chooses the next step, the commit point belongs to a flow: a scripted flow when fixed rules choose, an adaptive flow when a learned policy chooses. If the person chooses and the screen never needs uncommitted state, it belongs to a workspace. If the screen needs uncommitted state and nobody else sees the change live, it belongs to an instrument. If others see it live, concurrent writes that keep every invariant make a canvas; writes that can break an invariant make an arena.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="arrowhead" d="M1 1 L9 5 L1 9 Z"/>
    </marker>
  </defs>

  <g class="slate">
    <rect class="card" x="20" y="40" width="280" height="52" rx="6"/>
    <text class="head" x="36" y="71">1</text>
    <text class="label strong" x="56" y="71">Who chooses the next step?</text>

    <rect class="card" x="20" y="140" width="280" height="52" rx="6"/>
    <text class="head" x="36" y="171">2</text>
    <text class="label strong" x="56" y="162">Must the screen show state</text>
    <text class="label strong" x="56" y="180">before it is committed?</text>

    <rect class="card" x="20" y="240" width="280" height="52" rx="6"/>
    <text class="head" x="36" y="271">3</text>
    <text class="label strong" x="56" y="262">Does anyone else see the</text>
    <text class="label strong" x="56" y="280">change as it happens?</text>

    <rect class="card" x="20" y="340" width="280" height="52" rx="6"/>
    <text class="head" x="36" y="371">4</text>
    <text class="label strong" x="56" y="362">Do concurrent writes keep</text>
    <text class="label strong" x="56" y="380">every invariant?</text>
  </g>

  <path class="line" d="M300 66 H364 V42 H436" marker-end="url(#arrow)"/>
  <path class="line" d="M364 66 V94 H436" marker-end="url(#arrow)"/>
  <text class="note" x="308" y="60">program</text>

  <path class="line" d="M160 92 V136" marker-end="url(#arrow)"/>
  <text class="note" x="170" y="120">person</text>
  <path class="line" d="M300 166 H436" marker-end="url(#arrow)"/>
  <text class="note" x="372" y="160">no</text>

  <path class="line" d="M160 192 V236" marker-end="url(#arrow)"/>
  <text class="note" x="170" y="220">yes</text>
  <path class="line" d="M300 266 H436" marker-end="url(#arrow)"/>
  <text class="note" x="372" y="260">no</text>

  <path class="line" d="M160 292 V336" marker-end="url(#arrow)"/>
  <text class="note" x="170" y="320">yes</text>
  <path class="line" d="M300 366 H436" marker-end="url(#arrow)"/>
  <text class="note" x="372" y="360">yes</text>

  <path class="line" d="M160 392 V452 H436" marker-end="url(#arrow)"/>
  <text class="note" x="170" y="424">no</text>

  <g class="foam">
    <rect class="box" x="440" y="20" width="220" height="44" rx="6"/>
    <text class="head" x="456" y="39">Scripted flow</text>
    <text class="note" x="456" y="56">Rules choose each branch</text>
  </g>
  <g class="pine">
    <rect class="box" x="440" y="72" width="220" height="44" rx="6"/>
    <text class="head" x="456" y="91">Adaptive flow</text>
    <text class="note" x="456" y="108">A policy chooses toward a goal</text>
  </g>
  <g class="iris">
    <rect class="box" x="440" y="144" width="220" height="44" rx="6"/>
    <text class="head" x="456" y="163">Workspace</text>
    <text class="note" x="456" y="180">Views over shared tables</text>
  </g>
  <g class="gold">
    <rect class="box" x="440" y="244" width="220" height="44" rx="6"/>
    <text class="head" x="456" y="263">Instrument</text>
    <text class="note" x="456" y="280">One writer, local frame loop</text>
  </g>
  <g class="rose">
    <rect class="box" x="440" y="344" width="220" height="44" rx="6"/>
    <text class="head" x="456" y="363">Canvas</text>
    <text class="note" x="456" y="380">Writes merge without a sequencer</text>
  </g>
  <g class="love">
    <rect class="box" x="440" y="430" width="220" height="44" rx="6"/>
    <text class="head" x="456" y="449">Arena</text>
    <text class="note" x="456" y="466">A sequencer orders conflicts</text>
  </g>

  <text class="note" x="20" y="506">Question 4 applies to every shared write. In a flow or a workspace, a no means</text>
  <text class="note" x="20" y="522">the write runs as a transaction at a sequencer.</text>
</svg>
