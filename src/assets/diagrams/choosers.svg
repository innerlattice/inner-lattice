<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" aria-labelledby="title desc">
  <title id="title">Six choosers under one decision contract</title>
  <desc id="desc">One decision, with its view, options and deadline, can be bound to any of six choosers. A rule's propensities are trivially known, it replays exactly and it answers in microseconds. A randomizer's propensities are known, it replays with its seed and it answers in microseconds. A learned policy's propensities are known if logged, it replays with its state and it answers in milliseconds. An agent or model's propensities are partly known, it replays if the model, context and seed are pinned, and it answers in seconds. A person's propensities are unknown, a person cannot be asked again, and a person answers in seconds to days. The world's propensities are unknown, it can only be replayed from the record, and its latency varies.</desc>

  <g class="gold">
    <rect class="box" x="130" y="16" width="530" height="40" rx="6"/>
    <text class="head" x="395" y="41" text-anchor="middle">One decision: view, options, deadline</text>
  </g>
  <g class="line">
    <line x1="174" y1="56" x2="174" y2="80"/>
    <line x1="262" y1="56" x2="262" y2="80"/>
    <line x1="350" y1="56" x2="350" y2="80"/>
    <line x1="439" y1="56" x2="439" y2="80"/>
    <line x1="527" y1="56" x2="527" y2="80"/>
    <line x1="615" y1="56" x2="615" y2="80"/>
  </g>
  <text class="axis" x="20" y="41">Bound to</text>

  <g text-anchor="middle">
    <g class="iris">
      <text class="head" x="174" y="100">Rule</text>
      <text class="head" x="262" y="100">Random</text>
      <text class="head" x="350" y="100">Policy</text>
      <line class="line-hue" x1="138" y1="112" x2="386" y2="112"/>
      <text class="note" x="262" y="128">programs</text>
    </g>
    <g class="gold">
      <text class="head" x="439" y="100">Agent</text>
      <text class="note" x="439" y="128">or model</text>
    </g>
    <g class="pine">
      <text class="head" x="527" y="100">Person</text>
    </g>
    <g class="slate">
      <text class="head" x="615" y="100">World</text>
      <text class="note" x="615" y="128">clock, sensors</text>
    </g>
  </g>

  <g class="grid">
    <line x1="20" y1="146" x2="660" y2="146"/>
    <line x1="20" y1="200" x2="660" y2="200"/>
    <line x1="20" y1="254" x2="660" y2="254"/>
    <line x1="20" y1="300" x2="660" y2="300"/>
  </g>
  <text class="axis" x="20" y="170">Propensity</text>
  <text class="note" x="20" y="186">in the record</text>
  <text class="axis" x="20" y="224">Replay</text>
  <text class="note" x="20" y="240">ask again</text>
  <text class="axis" x="20" y="282">Latency</text>

  <g class="pine"><circle class="dot" cx="174" cy="164" r="5"/><circle class="dot" cx="262" cy="164" r="5"/><circle class="dot" cx="174" cy="218" r="5"/><circle class="dot" cx="262" cy="218" r="5"/><circle class="dot" cx="350" cy="218" r="5"/></g>
  <g class="gold"><circle class="dot" cx="350" cy="164" r="5"/><circle class="dot" cx="439" cy="164" r="5"/><circle class="dot" cx="439" cy="218" r="5"/></g>
  <g class="love"><circle class="dot" cx="527" cy="164" r="5"/><circle class="dot" cx="615" cy="164" r="5"/><circle class="dot" cx="527" cy="218" r="5"/><circle class="dot" cx="615" cy="218" r="5"/></g>

  <g class="note" text-anchor="middle">
    <text x="174" y="186">trivial</text>
    <text x="262" y="186">known</text>
    <text x="350" y="186">if logged</text>
    <text x="439" y="186">partial</text>
    <text x="527" y="186">unknown</text>
    <text x="615" y="186">unknown</text>
    <text x="174" y="240">exact</text>
    <text x="262" y="240">with seed</text>
    <text x="350" y="240">with state</text>
    <text x="439" y="240">if pinned</text>
    <text x="527" y="240">never</text>
    <text x="615" y="240">record only</text>
  </g>
  <g class="label" text-anchor="middle">
    <text x="174" y="282">µs</text>
    <text x="262" y="282">µs</text>
    <text x="350" y="282">ms</text>
    <text x="439" y="282">seconds</text>
    <text x="527" y="282">seconds to days</text>
    <text x="615" y="282">varies</text>
  </g>

  <g class="pine"><circle class="dot" cx="136" cy="326" r="5"/></g>
  <text class="note" x="146" y="330">yes</text>
  <g class="gold"><circle class="dot" cx="196" cy="326" r="5"/></g>
  <text class="note" x="206" y="330">partly, or under conditions</text>
  <g class="love"><circle class="dot" cx="380" cy="326" r="5"/></g>
  <text class="note" x="390" y="330">no</text>
</svg>
