<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title desc">
  <title id="title">Six classes of choices by coupling and response deadline</title>
  <desc id="desc">A table with response deadline as rows and coupling as columns. Long deadline and independent: compute anywhere, with the device as sequencer, such as a tax interview whose next step a function supplies, a spreadsheet edited by a person, and a coding agent. Long deadline and read-coupled: records merge and are delivered later, such as a comment thread, feed ranking by a function, and a moderation agent. Long deadline and order-coupled: wait for the seal from one sequencer per scope, such as a seat purchase, driver dispatch by a function, and a booking agent. Short deadline and independent: compute on the device, such as a pen stroke and a rhythm-game note supplied by a function. Short deadline and read-coupled: records merge and are delivered live, such as a shared-document keystroke, a whiteboard drag, and a co-editing agent. Short deadline and order-coupled: show provisional values and reconcile at the seal, such as a fighting-game input, a live-auction bid, and a bot opponent. The runtime's work grows to the right and downward.</desc>

  <g class="axis" text-anchor="middle">
    <text x="220" y="40">Independent</text>
    <text x="400" y="40">Read-coupled</text>
    <text x="580" y="40">Order-coupled</text>
  </g>
  <g class="axis">
    <text x="20" y="118">Long deadline</text>
    <text x="20" y="264">Short deadline</text>
  </g>
  <g class="note">
    <text x="20" y="136">can wait for</text>
    <text x="20" y="152">a round trip</text>
    <text x="20" y="282">shorter than</text>
    <text x="20" y="298">a round trip</text>
  </g>

  <g class="slate">
    <rect class="box" x="133" y="54" width="174" height="140" rx="6"/>
    <rect class="box" x="313" y="54" width="174" height="140" rx="6"/>
    <rect class="box" x="493" y="54" width="174" height="140" rx="6"/>
    <rect class="box" x="133" y="200" width="174" height="140" rx="6"/>
    <rect class="box" x="313" y="200" width="174" height="140" rx="6"/>
    <rect class="box" x="493" y="200" width="174" height="140" rx="6"/>

    <text class="head" x="147" y="80">Compute anywhere</text>
    <text class="note" x="147" y="98">device is the sequencer</text>
    <text class="head" x="327" y="80">Deliver later</text>
    <text class="note" x="327" y="98">records merge</text>
    <text class="head" x="507" y="80">Wait for the seal</text>
    <text class="note" x="507" y="98">one sequencer per scope</text>
    <text class="head" x="147" y="226">Compute on device</text>
    <text class="note" x="147" y="244">device is the sequencer</text>
    <text class="head" x="327" y="226">Deliver live</text>
    <text class="note" x="327" y="244">records merge</text>
    <text class="head" x="507" y="226">Provisional values</text>
    <text class="note" x="507" y="244">reconcile at the seal</text>
  </g>

  <g class="iris">
    <circle class="dot" cx="153" cy="122" r="5"/>
    <circle class="dot" cx="333" cy="146" r="5"/>
    <circle class="dot" cx="513" cy="146" r="5"/>
    <circle class="dot" cx="153" cy="292" r="5"/>
    <circle class="dot" cx="513" cy="316" r="5"/>
  </g>
  <g class="pine">
    <circle class="dot" cx="153" cy="146" r="5"/>
    <circle class="dot" cx="333" cy="122" r="5"/>
    <circle class="dot" cx="513" cy="122" r="5"/>
    <circle class="dot" cx="153" cy="268" r="5"/>
    <circle class="dot" cx="333" cy="268" r="5"/>
    <circle class="dot" cx="333" cy="292" r="5"/>
    <circle class="dot" cx="513" cy="268" r="5"/>
    <circle class="dot" cx="513" cy="292" r="5"/>
  </g>
  <g class="gold">
    <circle class="dot" cx="153" cy="170" r="5"/>
    <circle class="dot" cx="333" cy="170" r="5"/>
    <circle class="dot" cx="513" cy="170" r="5"/>
    <circle class="dot" cx="333" cy="316" r="5"/>
  </g>
  <g class="label">
    <text x="165" y="126">Tax interview</text>
    <text x="165" y="150">Spreadsheet</text>
    <text x="165" y="174">Coding agent</text>
    <text x="345" y="126">Comment thread</text>
    <text x="345" y="150">Feed ranking</text>
    <text x="345" y="174">Moderation agent</text>
    <text x="525" y="126">Seat purchase</text>
    <text x="525" y="150">Driver dispatch</text>
    <text x="525" y="174">Booking agent</text>
    <text x="165" y="272">Pen stroke</text>
    <text x="165" y="296">Rhythm-game note</text>
    <text x="345" y="272">Shared-doc keystroke</text>
    <text x="345" y="296">Whiteboard drag</text>
    <text x="345" y="320">Co-editing agent</text>
    <text x="525" y="272">Fighting-game input</text>
    <text x="525" y="296">Live-auction bid</text>
    <text x="525" y="320">Bot opponent</text>
  </g>

  <text class="axis" x="133" y="372">Resolver</text>
  <g class="iris"><circle class="dot" cx="200" cy="368" r="5"/></g>
  <text class="note" x="210" y="372">function</text>
  <g class="pine"><circle class="dot" cx="276" cy="368" r="5"/></g>
  <text class="note" x="286" y="372">person</text>
  <g class="gold"><circle class="dot" cx="344" cy="368" r="5"/></g>
  <text class="note" x="354" y="372">AI model</text>
  <text class="note" x="667" y="372" text-anchor="end">Runtime work grows right and down</text>
</svg>
