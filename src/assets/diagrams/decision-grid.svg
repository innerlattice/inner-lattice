<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title desc">
  <title id="title">Six cells of deadline and coupling</title>
  <desc id="desc">A grid with feedback deadline as rows and coupling as columns. Long deadline and no coupling: private work, request and response, such as a tax interview picked by the program, a spreadsheet picked by a person, and a coding agent. Long deadline and influence: commons, which merge and propagate later, such as a comment thread, feed ranking and a moderation agent. Long deadline and conflict: registries, which wait for a closer, such as a seat purchase, driver dispatch and a booking agent. Short deadline and no coupling: instruments, closed on the device, such as a pen stroke and a rhythm-game note. Short deadline and influence: canvases, which merge and sync live, such as a shared-document keystroke, a whiteboard drag and a co-editing agent. Short deadline and conflict: arenas, which predict and then reconcile with a closer, such as a fighting-game input, a live-auction bid and a bot opponent. Each step right or down adds machinery.</desc>

  <g class="axis" text-anchor="middle">
    <text x="220" y="40">No coupling</text>
    <text x="400" y="40">Influence</text>
    <text x="580" y="40">Conflict</text>
  </g>
  <g class="axis">
    <text x="20" y="118">Long deadline</text>
    <text x="20" y="264">Short deadline</text>
  </g>
  <g class="note">
    <text x="20" y="136">can wait for</text>
    <text x="20" y="152">the closer</text>
    <text x="20" y="282">shorter than the</text>
    <text x="20" y="298">round trip</text>
  </g>

  <g class="slate">
    <rect class="box" x="133" y="54" width="174" height="140" rx="6"/>
    <rect class="box" x="313" y="54" width="174" height="140" rx="6"/>
    <rect class="box" x="493" y="54" width="174" height="140" rx="6"/>
    <rect class="box" x="133" y="200" width="174" height="140" rx="6"/>
    <rect class="box" x="313" y="200" width="174" height="140" rx="6"/>
    <rect class="box" x="493" y="200" width="174" height="140" rx="6"/>

    <text class="head" x="147" y="80">Private work</text>
    <text class="note" x="147" y="98">request and response</text>
    <text class="head" x="327" y="80">Commons</text>
    <text class="note" x="327" y="98">merge, propagate later</text>
    <text class="head" x="507" y="80">Registries</text>
    <text class="note" x="507" y="98">wait for the closer</text>
    <text class="head" x="147" y="226">Instruments</text>
    <text class="note" x="147" y="244">the device closes</text>
    <text class="head" x="327" y="226">Canvases</text>
    <text class="note" x="327" y="244">merge, sync live</text>
    <text class="head" x="507" y="226">Arenas</text>
    <text class="note" x="507" y="244">predict, then reconcile</text>
  </g>

  <g class="iris">
    <circle class="dot" cx="153" cy="122" r="5"/>
    <circle class="dot" cx="333" cy="146" r="5"/>
    <circle class="dot" cx="513" cy="146" r="5"/>
    <circle class="dot" cx="153" cy="292" r="5"/>
    <circle class="dot" cx="513" cy="316" r="5"/>
  </g>
  <g class="pine">
    <circle class="dot" cx="153" cy="146" r="5"/>
    <circle class="dot" cx="333" cy="122" r="5"/>
    <circle class="dot" cx="513" cy="122" r="5"/>
    <circle class="dot" cx="153" cy="268" r="5"/>
    <circle class="dot" cx="333" cy="268" r="5"/>
    <circle class="dot" cx="333" cy="292" r="5"/>
    <circle class="dot" cx="513" cy="268" r="5"/>
    <circle class="dot" cx="513" cy="292" r="5"/>
  </g>
  <g class="gold">
    <circle class="dot" cx="153" cy="170" r="5"/>
    <circle class="dot" cx="333" cy="170" r="5"/>
    <circle class="dot" cx="513" cy="170" r="5"/>
    <circle class="dot" cx="333" cy="316" r="5"/>
  </g>
  <g class="label">
    <text x="165" y="126">Tax interview</text>
    <text x="165" y="150">Spreadsheet</text>
    <text x="165" y="174">Coding agent</text>
    <text x="345" y="126">Comment thread</text>
    <text x="345" y="150">Feed ranking</text>
    <text x="345" y="174">Moderation agent</text>
    <text x="525" y="126">Seat purchase</text>
    <text x="525" y="150">Driver dispatch</text>
    <text x="525" y="174">Booking agent</text>
    <text x="165" y="272">Pen stroke</text>
    <text x="165" y="296">Rhythm-game note</text>
    <text x="345" y="272">Shared-doc keystroke</text>
    <text x="345" y="296">Whiteboard drag</text>
    <text x="345" y="320">Co-editing agent</text>
    <text x="525" y="272">Fighting-game input</text>
    <text x="525" y="296">Live-auction bid</text>
    <text x="525" y="320">Bot opponent</text>
  </g>

  <text class="axis" x="133" y="372">Who picks</text>
  <g class="iris"><circle class="dot" cx="214" cy="368" r="5"/></g>
  <text class="note" x="224" y="372">program</text>
  <g class="pine"><circle class="dot" cx="290" cy="368" r="5"/></g>
  <text class="note" x="300" y="372">person</text>
  <g class="gold"><circle class="dot" cx="358" cy="368" r="5"/></g>
  <text class="note" x="368" y="372">agent</text>
  <text class="note" x="667" y="372" text-anchor="end">Each step right or down adds machinery</text>
</svg>
