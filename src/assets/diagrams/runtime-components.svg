<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" role="img" aria-labelledby="title desc">
  <title id="title">Runtime components</title>
  <desc id="desc">A server runs four components. The record holds facts with their chooser, view, propensity, program version and causal position. The rules engine derives views from the record and maintains subscriptions, policies, goals and provenance. The gateway receives open decisions from the rules engine, binds each to a chooser, checks policy, enforces deadlines, logs propensities and stores pending decisions as facts. Confluent facts go straight from the gateway to the record; contested decisions go as claims to closers, one per conflict scope, which record the closed facts. Programs, agents and the world answer the server's gateway. A client replica runs a local gateway, local rules and a local record; the person answers the local gateway, which predicts and then reconciles. The client syncs facts with the server record and receives views from the rules engine.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrowhead" d="M1 1 L9 5 L1 9 Z"/></marker>
  </defs>

  <g class="rose">
    <rect class="box" x="64" y="12" width="92" height="28" rx="14"/>
    <text class="label ink" x="110" y="31" text-anchor="middle">person</text>
    <rect class="box" x="300" y="12" width="92" height="28" rx="14"/>
    <text class="label ink" x="346" y="31" text-anchor="middle">program</text>
    <rect class="box" x="420" y="12" width="92" height="28" rx="14"/>
    <text class="label ink" x="466" y="31" text-anchor="middle">agent</text>
    <rect class="box" x="540" y="12" width="92" height="28" rx="14"/>
    <text class="label ink" x="586" y="31" text-anchor="middle">world</text>
  </g>
  <g class="line">
    <line x1="110" y1="40" x2="110" y2="54"/>
    <line x1="346" y1="40" x2="346" y2="110"/>
    <line x1="466" y1="40" x2="466" y2="110"/>
    <line x1="586" y1="40" x2="586" y2="110"/>
  </g>
  <text class="note" x="352" y="80">ask, answer</text>

  <g class="slate">
    <rect class="box-open" x="20" y="54" width="180" height="356" rx="8"/>
    <text class="head" x="36" y="78">Client replica</text>
    <text class="note" x="36" y="96">predicts, then reconciles</text>
  </g>
  <g class="gold">
    <rect class="box" x="36" y="110" width="148" height="60" rx="6"/>
    <text class="head" x="110" y="145" text-anchor="middle">Local gateway</text>
  </g>
  <g class="iris">
    <rect class="box" x="36" y="222" width="148" height="60" rx="6"/>
    <text class="head" x="110" y="257" text-anchor="middle">Local rules</text>
  </g>
  <g class="pine">
    <rect class="box" x="36" y="330" width="148" height="70" rx="6"/>
    <text class="head" x="110" y="370" text-anchor="middle">Local record</text>
  </g>

  <g class="gold">
    <rect class="box" x="250" y="110" width="410" height="60" rx="6"/>
    <text class="head" x="266" y="134">Gateway</text>
    <text class="note" x="266" y="154">binds choosers, checks policy, enforces deadlines, logs propensities</text>
  </g>
  <g class="iris">
    <rect class="box" x="250" y="222" width="190" height="60" rx="6"/>
    <text class="head" x="266" y="246">Rules engine</text>
    <text class="note" x="266" y="266">views, subscriptions, goals</text>
  </g>
  <g class="love">
    <rect class="box" x="520" y="222" width="140" height="60" rx="6"/>
    <text class="head" x="536" y="246">Closers</text>
    <text class="note" x="536" y="266">one per scope</text>
  </g>
  <g class="pine">
    <rect class="box" x="250" y="330" width="410" height="70" rx="6"/>
    <text class="head" x="266" y="354">Record</text>
    <text class="note" x="266" y="374">facts with chooser, view, propensity,</text>
    <text class="note" x="266" y="390">program version and causal position</text>
  </g>

  <g class="line" marker-end="url(#arrow)">
    <line x1="330" y1="328" x2="330" y2="286"/>
    <line x1="330" y1="220" x2="330" y2="174"/>
    <line x1="590" y1="172" x2="590" y2="218"/>
    <line x1="590" y1="284" x2="590" y2="326"/>
    <line x1="480" y1="172" x2="480" y2="326"/>
    <line x1="248" y1="252" x2="190" y2="252"/>
  </g>
  <line class="line" x1="188" y1="365" x2="246" y2="365" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g class="label">
    <text x="338" y="310">derive</text>
    <text x="338" y="200">open</text>
    <text x="598" y="200">claim</text>
    <text x="598" y="310">close</text>
    <text x="219" y="244" text-anchor="middle">views</text>
    <text x="219" y="356" text-anchor="middle">sync</text>
  </g>
  <text class="note" text-anchor="middle" transform="translate(474 250) rotate(-90)">confluent facts</text>
</svg>
