<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" role="img" aria-labelledby="title desc">
  <title id="title">One calculus, five levels</title>
  <desc id="desc">Five levels stacked from least to most powerful, each adding one effect. Values add nothing beyond data and constraints and merge in any order; they hold schemas, tokens and copy. Policies add predicates without recursion and can be analyzed by a solver; they delete influence edges. Rules add recursion to a fixpoint; they terminate and the compiler reports where a closer is needed; they hold views, goals and coupling. Flows add ask, claim and timers; their paths can be enumerated and their decisions have stable ids. Procedures add general recursion, I/O and holes for agents; their boundaries are typed, and they are logged and replayable. Laws, presentation and modules span all five levels.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrowhead" d="M1 1 L9 5 L1 9 Z"/></marker>
  </defs>

  <text class="axis" x="52" y="22">Level</text>
  <text class="axis" x="200" y="22">Adds</text>
  <text class="axis" x="352" y="22">Keeps</text>

  <g class="slate">
    <rect class="card" x="44" y="34" width="440" height="58" rx="6"/>
    <text class="head" x="60" y="58">Values</text>
    <text class="note" x="60" y="77">schemas, tokens, copy</text>
    <text class="label" x="200" y="58">nothing</text>
    <text class="note" x="200" y="77">data and constraints</text>
    <text class="label ink strong" x="352" y="58">merge in any order</text>

    <rect class="card" x="44" y="100" width="440" height="58" rx="6"/>
    <text class="head" x="60" y="124">Policies</text>
    <text class="note" x="60" y="143">influence edges</text>
    <text class="label" x="200" y="124">predicates</text>
    <text class="note" x="200" y="143">no recursion</text>
    <text class="label ink strong" x="352" y="124">decidable analysis</text>

    <rect class="card" x="44" y="166" width="440" height="58" rx="6"/>
    <text class="head" x="60" y="190">Rules</text>
    <text class="note" x="60" y="209">views, goals, coupling</text>
    <text class="label" x="200" y="190">fixpoints</text>
    <text class="note" x="200" y="209">over finite facts</text>
    <text class="label ink strong" x="352" y="190">termination</text>
    <text class="note" x="352" y="209">closure points reported</text>

    <rect class="card" x="44" y="232" width="440" height="58" rx="6"/>
    <text class="head" x="60" y="256">Flows</text>
    <text class="note" x="60" y="275">decisions</text>
    <text class="label" x="200" y="256">ask, claim, timers</text>
    <text class="label ink strong" x="352" y="256">enumerable paths</text>
    <text class="note" x="352" y="275">stable ids</text>

    <rect class="card" x="44" y="298" width="440" height="58" rx="6"/>
    <text class="head" x="60" y="322">Procedures</text>
    <text class="note" x="60" y="341">everything else</text>
    <text class="label" x="200" y="322">recursion, I/O</text>
    <text class="note" x="200" y="341">holes for agents</text>
    <text class="label ink strong" x="352" y="322">typed boundaries</text>
    <text class="note" x="352" y="341">logged, replayable</text>
  </g>

  <line class="line" x1="26" y1="40" x2="26" y2="350" marker-end="url(#arrow)"/>
  <text class="note" text-anchor="middle" transform="translate(16 195) rotate(90)">each level adds one effect</text>

  <g class="pine">
    <rect class="box" x="500" y="34" width="52" height="322" rx="6"/>
    <text class="head" text-anchor="middle" transform="translate(522 195) rotate(-90)">Laws</text>
    <text class="note ink" text-anchor="middle" transform="translate(540 195) rotate(-90)">checked at the level they cover</text>
  </g>
  <g class="gold">
    <rect class="box" x="560" y="34" width="52" height="322" rx="6"/>
    <text class="head" text-anchor="middle" transform="translate(582 195) rotate(-90)">Presentation</text>
    <text class="note ink" text-anchor="middle" transform="translate(600 195) rotate(-90)">intents bound per channel</text>
  </g>
  <g class="iris">
    <rect class="box" x="620" y="34" width="52" height="322" rx="6"/>
    <text class="head" text-anchor="middle" transform="translate(642 195) rotate(-90)">Modules</text>
    <text class="note ink" text-anchor="middle" transform="translate(660 195) rotate(-90)">notions with coordinates</text>
  </g>
</svg>
