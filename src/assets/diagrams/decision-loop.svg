<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="title desc">
  <title id="title">The decision loop</title>
  <desc id="desc">Four parts in a clockwise loop. Facts, the recorded decisions, feed rules. Rules derive views and state and open decisions. Each open decision has a view, options, a deadline and a chooser binding. A chooser, which is a person, a program, an agent or the world, fills the decision, and the result is recorded as a new fact. In the middle, two special decisions: closure, which decides that the facts are complete, and program change, which decides that the rules change.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrowhead" d="M1 1 L9 5 L1 9 Z"/></marker>
  </defs>

  <g class="pine">
    <rect class="box" x="20" y="130" width="190" height="100" rx="6"/>
    <text class="head" x="36" y="156">Facts</text>
    <text class="note" x="36" y="178">option, chooser, view,</text>
    <text class="note" x="36" y="196">program version</text>
    <text class="note" x="36" y="214">never edited</text>
  </g>
  <g class="iris">
    <rect class="box" x="245" y="20" width="190" height="100" rx="6"/>
    <text class="head" x="261" y="46">Rules</text>
    <text class="note" x="261" y="68">views, state, permissions,</text>
    <text class="note" x="261" y="86">indexes, goals</text>
    <text class="note" x="261" y="104">deterministic</text>
  </g>
  <g class="gold">
    <rect class="box" x="470" y="130" width="190" height="100" rx="6"/>
    <text class="head" x="486" y="156">Open decisions</text>
    <text class="note" x="486" y="178">view, options,</text>
    <text class="note" x="486" y="196">deadline,</text>
    <text class="note" x="486" y="214">chooser binding</text>
  </g>
  <g class="rose">
    <rect class="box" x="245" y="240" width="190" height="100" rx="6"/>
    <text class="head" x="261" y="264">Choosers</text>
  </g>
  <g class="slate">
    <rect class="card" x="261" y="274" width="76" height="26" rx="4"/>
    <text class="label" x="299" y="291" text-anchor="middle">person</text>
    <rect class="card" x="343" y="274" width="76" height="26" rx="4"/>
    <text class="label" x="381" y="291" text-anchor="middle">program</text>
    <rect class="card" x="261" y="306" width="76" height="26" rx="4"/>
    <text class="label" x="299" y="323" text-anchor="middle">agent</text>
    <rect class="card" x="343" y="306" width="76" height="26" rx="4"/>
    <text class="label" x="381" y="323" text-anchor="middle">world</text>
  </g>

  <g class="line" marker-end="url(#arrow)">
    <path d="M115 128 C115 75 180 70 241 70"/>
    <path d="M439 70 C500 70 565 75 565 126"/>
    <path d="M565 234 C565 285 500 290 439 290"/>
    <path d="M241 290 C180 290 115 285 115 234"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="150" y="58">derive</text>
    <text x="530" y="58">open</text>
    <text x="530" y="314">ask</text>
    <text x="150" y="314">record</text>
  </g>

  <g class="slate">
    <rect class="card" x="224" y="142" width="232" height="84" rx="6"/>
    <text class="head" x="240" y="166">Special decisions</text>
    <text class="label strong" x="240" y="188">Closure</text>
    <text class="note" x="300" y="188">the facts are complete</text>
    <text class="label strong" x="240" y="210">Program change</text>
    <text class="note" x="350" y="210">the rules change</text>
  </g>
</svg>
